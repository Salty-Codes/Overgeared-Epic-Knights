modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Salty-Codes/Overgeared-Epic-Knights/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="overgeared_epic_knights.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Comment out for DataGen
[[dependencies.${mod_id}]]
    modId="magistuarmory"
    mandatory=true
    versionRange="[10.15,)"
    ordering="AFTER"
    side="BOTH"

# Comment out for DataGen
[[dependencies.${mod_id}]]
    modId="overgeared"
    mandatory=true
    versionRange="[1.6.37,)"
    ordering="AFTER"
    side="BOTH"

# Optional — the Epic Knights addons. Their gear gets Overgeared recipes when they are present.
[[dependencies.${mod_id}]]
    modId="magistuarmoryaddon"
    mandatory=false
    versionRange="[2.6,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="slavicarmory"
    mandatory=false
    versionRange="[2.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="antiquelegacy"
    mandatory=false
    versionRange="[1.13,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="darkagesarmory"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="epic_knights_ores_and_alloys"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="BOTH"
